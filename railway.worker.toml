# railway.worker.toml — Lumora HEATMAP worker (default).
#
# This file deploys the orderbook heatmap WS collector. To run the
# WHALE worker as well, deploy it as a SEPARATE Railway service (see
# docs/brain/07_TERMINAL_COMMANDS.md "LM63K Whale Worker Deployment
# Playbook"). DO NOT replace the heatmap startCommand below with the
# whale command — the two workers run independently.
#
# Whale worker reference (paste into the *second* Railway service):
#   startCommand = "python scripts/run_binance_trade_stream_smoke.py --use-env-config --heartbeat-interval 60"
# Whale worker env vars (server-only; never expose to frontend):
#   SUPABASE_URL                   project URL
#   SUPABASE_SERVICE_ROLE_KEY      service-role key  ← never commit, never NEXT_PUBLIC_*
#   WORKER_SYMBOLS                 e.g. BTCUSDT,ETHUSDT,SOLUSDT,LINKUSDT
#   WHALE_WORKER_TARGET            supabase
#   WHALE_WORKER_FOREVER           true
#   WHALE_WORKER_MIN_NOTIONAL      (optional) global override; otherwise per-symbol thresholds apply

[build]
builder = "nixpacks"

# NOTE (Disk IO): `--range-mode wide` produced ~414 KB JSONB payloads upserted
# every WORKER_HISTORY_INTERVAL seconds × N symbols, which drained the Supabase
# free-tier Disk IO budget and made the instance unresponsive. Switched to
# `standard` (focused price band → far smaller payload). Pair with a higher
# WORKER_HISTORY_INTERVAL (30–60s) on the Railway service to keep write IO low.
[deploy]
startCommand = "python scripts/run_binance_ws_heatmap_live.py --use-env-config --target supabase --forever --range-mode standard"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
